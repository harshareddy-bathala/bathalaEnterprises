<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline | Bathala Enterprises</title>
    <meta
      name="description"
      content="You are currently offline. Reconnect to continue browsing Bathala Enterprises listings and services."
    />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif;
        background: #f8f6f2;
        color: #1a1f2e;
      }

      .panel {
        width: min(560px, 100%);
        border: 1px solid #e8e4dc;
        border-radius: 16px;
        background: #ffffff;
        padding: 24px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        text-align: center;
      }

      h1 {
        margin: 8px 0 12px;
        font-size: 1.75rem;
      }

      p {
        margin: 0;
        color: #6b7280;
        line-height: 1.6;
      }

      .actions {
        margin-top: 20px;
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
      }

      a,
      button {
        border-radius: 10px;
        border: 1px solid #e8e4dc;
        background: #fff;
        color: #2c3340;
        min-height: 42px;
        padding: 0 14px;
        font-weight: 600;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      .primary {
        background: #b89a5e;
        border-color: #b89a5e;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <p>Bathala Enterprises</p>
      <h1>You are offline</h1>
      <p>
        Please reconnect to browse the latest properties and services. Cached pages may still be available.
      </p>
      <div class="actions">
        <button class="primary" type="button" onclick="window.location.reload()">Try Again</button>
        <a href="/">Go Home</a>
      </div>
    </main>
  </body>
</html>
